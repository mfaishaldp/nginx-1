server {
    listen 80;

    server_name localhost;

    location /app1/ {
        proxy_pass http://web:3000/;    # apps1 service name = 'web'
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /app2/ {
        proxy_pass http://web-1:3000/;  # apps2 service name = 'web-1'
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}